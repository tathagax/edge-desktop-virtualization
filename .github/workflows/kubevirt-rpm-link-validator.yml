name: Kubevirt RPM Link Validator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

jobs:
  validate-and-fix-rpm-links:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate and repair CentOS 9 x86_64 RPM links
        shell: bash
        run: |
          python3 .github/scripts/validate_rpm_links.py --root .

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push RPM URL fixes
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/kubevirt-rpm-link-fixes
          git add -A
          git commit -m "chore(kubevirt-patch): repair CentOS 9 x86_64 rpm links"
          git push origin automation/kubevirt-rpm-link-fixes --force
